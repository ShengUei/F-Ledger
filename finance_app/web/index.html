<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>股票績效與配息追蹤</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>股票績效與配息追蹤</h1>
        <p id="statusText" aria-live="polite">載入中</p>
      </div>
      <button class="icon-button" id="refreshButton" type="button" title="重新整理" aria-label="重新整理">
        ↻
      </button>
    </header>

    <main class="app-shell">
      <section class="workspace">
        <div class="toolbar">
          <label>
            結算日
            <input id="asOfInput" type="date" />
          </label>
          <label>
            投資組合
            <select id="portfolioFilter">
              <option value="All">全部</option>
            </select>
          </label>
          <label>
            報表幣別
            <select id="currencyFilter">
              <option value="TWD">TWD</option>
              <option value="USD">USD</option>
            </select>
          </label>
          <label>
            起日
            <input id="startInput" type="date" />
          </label>
          <label>
            迄日
            <input id="endInput" type="date" />
          </label>
          <div class="segmented" aria-label="圖表區間">
            <button type="button" data-interval="daily">日</button>
            <button type="button" data-interval="monthly" class="active">月</button>
            <button type="button" data-interval="yearly">年</button>
          </div>
        </div>

        <section class="metric-grid" id="metricGrid"></section>

        <section class="chart-grid">
          <article class="chart-panel performance-panel">
            <header>
              <h2>資產與損益</h2>
              <div class="legend" id="performanceLegend"></div>
            </header>
            <div class="chart-options">
              <label>
                X軸
                <select id="performanceXAxisMode">
                  <option value="auto">自動</option>
                  <option value="full">完整日期</option>
                  <option value="month">年月</option>
                  <option value="year">年份</option>
                </select>
              </label>
              <label>
                Y軸
                <select id="performanceYAxisMode">
                  <option value="amount">金額</option>
                  <option value="return_pct">報酬率</option>
                </select>
              </label>
            </div>
            <svg id="performanceChart" role="img" aria-label="資產與損益圖表"></svg>
          </article>
          <article class="chart-panel">
            <header>
              <h2>年度績效</h2>
              <div class="legend" id="annualLegend"></div>
            </header>
            <div class="chart-options">
              <label>
                X軸
                <select id="annualXAxisMode">
                  <option value="auto">自動</option>
                  <option value="full">完整日期</option>
                  <option value="year">年份</option>
                  <option value="short_year">短年份</option>
                </select>
              </label>
              <label>
                Y軸
                <select id="annualYAxisMode">
                  <option value="amount">金額</option>
                  <option value="return_pct">報酬率</option>
                </select>
              </label>
            </div>
            <svg id="annualChart" role="img" aria-label="年度績效圖表"></svg>
          </article>
        </section>

        <section class="table-panel">
          <header>
            <h2>持股</h2>
          </header>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>股票</th>
                  <th>原幣</th>
                  <th>股數</th>
                  <th>均價</th>
                  <th>現價</th>
                  <th>市值</th>
                  <th>占比</th>
                  <th>未實現</th>
                  <th>配息</th>
                </tr>
              </thead>
              <tbody id="positionsBody"></tbody>
            </table>
          </div>
        </section>

        <section class="allocation-panel">
          <header>
            <h2>持股占比</h2>
          </header>
          <div id="allocationGrid" class="allocation-grid"></div>
        </section>
      </section>

      <aside class="side-rail">
        <section class="form-panel">
          <div class="tabs" role="tablist" aria-label="新增資料">
            <button class="active" type="button" data-form-tab="trade">交易</button>
            <button type="button" data-form-tab="dividend">配息</button>
          </div>

          <form id="tradeForm" class="record-form">
            <label>
              日期
              <input name="date" type="date" required />
            </label>
            <label>
              股票代號
              <input name="symbol" type="text" placeholder="2330.TW" required />
            </label>
            <label>
              投資組合
              <select name="portfolio" data-portfolio-select required></select>
            </label>
            <label class="portfolio-new hidden">
              新投資組合
              <input name="new_portfolio" type="text" />
            </label>
            <label>
              原幣
              <select name="currency">
                <option value="TWD">TWD</option>
                <option value="USD">USD</option>
              </select>
            </label>
            <label>
              方向
              <select name="side">
                <option value="BUY">買進</option>
                <option value="SELL">賣出</option>
              </select>
            </label>
            <label>
              股數
              <input name="quantity" type="number" min="0" step="0.0001" required />
            </label>
            <label>
              成交價
              <input name="price" type="number" min="0" step="0.0001" required />
            </label>
            <label>
              手續費
              <input name="fees" type="number" min="0" step="0.0001" value="0" />
            </label>
            <label class="full">
              備註
              <input name="notes" type="text" />
            </label>
            <button class="primary" type="submit">新增交易</button>
          </form>

          <form id="dividendForm" class="record-form hidden">
            <label>
              日期
              <input name="date" type="date" required />
            </label>
            <label>
              股票代號
              <input name="symbol" type="text" placeholder="AAPL" required />
            </label>
            <label>
              投資組合
              <select name="portfolio" data-portfolio-select required></select>
            </label>
            <label class="portfolio-new hidden">
              新投資組合
              <input name="new_portfolio" type="text" />
            </label>
            <label>
              原幣
              <select name="currency">
                <option value="TWD">TWD</option>
                <option value="USD">USD</option>
              </select>
            </label>
            <label>
              配息總額
              <input name="gross_amount" type="number" min="0" step="0.0001" required />
            </label>
            <label>
              稅額
              <input name="tax" type="number" min="0" step="0.0001" value="0" />
            </label>
            <label class="full">
              備註
              <input name="notes" type="text" />
            </label>
            <button class="primary" type="submit">新增配息</button>
          </form>

          <section class="import-panel">
            <header>
              <h2>批次匯入交易</h2>
              <button class="secondary" id="downloadTradeTemplateButton" type="button">下載範本</button>
            </header>
            <label>
              CSV 檔案
              <input id="tradeImportFile" type="file" accept=".csv,text/csv" />
            </label>
            <button class="primary" id="importTradesButton" type="button">匯入交易</button>
            <p id="importStatus" aria-live="polite"></p>
          </section>
        </section>

        <section class="table-panel compact">
          <header>
            <h2>紀錄</h2>
          </header>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>日期</th>
                  <th>股票</th>
                  <th>投組</th>
                  <th>原幣</th>
                  <th>類型</th>
                  <th>金額</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="recordsBody"></tbody>
            </table>
          </div>
        </section>
      </aside>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
